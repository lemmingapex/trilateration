<svg xmlns="http://www.w3.org/2000/svg" width="520" height="692" viewBox="0 0 520 692" role="img">
<title>Radical axes of three distance circles</title>
<desc>Three anchors and their distance circles. Subtracting the equations of two circles gives a straight line, the radical axis, through the two points where those circles cross. The three radical axes meet at the position (46.99, 41.98).</desc>
<style>svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--ring:rgba(11,11,11,.10);--distance:#2a78d6;--estimate:#eb6834;--path:#1baf7a}@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--ring:rgba(255,255,255,.10);--distance:#3987e5;--estimate:#d95926;--path:#199e70}}.card{fill:var(--surface);stroke:var(--ring)}.grid{stroke:var(--grid);stroke-width:1}.tick{font:11px system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--muted);font-variant-numeric:tabular-nums}.circle{fill:var(--distance);fill-opacity:.05;stroke:var(--distance);stroke-width:1.5}.outlier{stroke-dasharray:6 4}.open{fill:none}.anchor{fill:var(--ink);stroke:var(--surface);stroke-width:2}.estimate{fill:var(--estimate);stroke:var(--surface);stroke-width:2}.ellipse{fill:var(--estimate);fill-opacity:.14;stroke:var(--estimate);stroke-width:2}.alternative{fill:var(--surface);fill-opacity:.6;stroke:var(--estimate);stroke-width:2;stroke-dasharray:3 2.5}.residual{stroke:var(--ink2);stroke-width:2;stroke-linecap:round}.path{fill:none;stroke:var(--path);stroke-width:2;stroke-linecap:round}.start{fill:var(--surface);stroke:var(--path);stroke-width:2}.step{fill:var(--path);stroke:var(--surface);stroke-width:2}.axis{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5}.truth{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}.route{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}.fix{fill:none;stroke:var(--ink2);stroke-width:1.5}.track{fill:none;stroke:var(--estimate);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.hit{fill:transparent}.caption{font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--ink)}.label,.legend{font:12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--ink2)}</style>
<defs><clipPath id="radical-plot"><rect x="39.80" y="14.00" width="466.20" height="595.08"/></clipPath></defs>
