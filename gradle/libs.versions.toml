[versions]
hipparchus = "4.1"
jacoco = "0.8.16"
junit = "6.1.3"
maven-publish = "0.37.0"

[libraries]
hipparchus-core = { module = "org.hipparchus:hipparchus-core", version.ref = "hipparchus" }
hipparchus-optim = { module = "org.hipparchus:hipparchus-optim", version.ref = "hipparchus" }
hipparchus-filtering = { module = "org.hipparchus:hipparchus-filtering", version.ref = "hipparchus" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
