name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Gradle 9 needs JDK 17+ to run; the library itself targets Java 8 via --release 8.
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Also validates the checksum of the Gradle wrapper jar.
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build

      - name: Upload test and coverage reports
        if: always() && matrix.java == 25
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: build/reports/
