name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run in progress; runs on master always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Java 17 is the minimum supported version; 21 and 25 are the later LTS releases.
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Also validates the checksum of the Gradle wrapper jar.
      - uses: gradle/actions/setup-gradle@v6

      # Deprecations fail the build, so they are fixed before the next major Gradle version.
      - run: ./gradlew build --warning-mode fail

      - name: Check README figures are up to date
        if: matrix.java == 25
        run: |
          ./gradlew renderDocs
          if [ -n "$(git status --porcelain -- docs/images)" ]; then
            git status --short -- docs/images
            echo "The figures in docs/images are stale: run ./gradlew renderDocs and commit the result."
            exit 1
          fi

      - name: Upload test and coverage reports
        if: always() && matrix.java == 25
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: build/reports/

